- name: Update package
  apt:
    update_cache: yes
- name: Upgrade package
  apt:
    upgrade: safe
    autoremove: yes

- name: Install required package
  apt:
    name:
    - nginx

- name: Copy configuration template
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: restart nginx

- name: Start and enabled nginx
  systemd:
    name: nginx
    state: started
    enabled: yes