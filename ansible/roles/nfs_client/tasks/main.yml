- name: Update package
  apt:
    update_cache: yes
- name: Upgrade package
  apt:
    upgrade: safe
    autoremove: yes


- name: Install required package
  apt:
    name:
    - nfs-common


- name: Point mount
  file: path="{{ nfs_mount_point }}" state=directory

- name: Mount directory
  ansible.posix.mount:
    path: "{{ nfs_mount_point }}"
    src: "{{ nfs_server_ip }}:{{ nfs_remote_path }}"
    fstype: nfs4
    state: mounted